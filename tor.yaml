# Tor SUGAM: Nice Robus RBS mit BiDi-WiFi (ESP32-D0WD-V3 rev3.1)
#
# Bewusst nur Bedienung und Status. Kein Schreiben von Steuerungsparametern:
# Die Konfigurationsschalter (Auto-Close, Photo-Close, Always-Close, Standby,
# Peak-Mode, Pre-Flash), der Gate-Lock und das Raw-Command-Feld aus
# example.yaml fehlen absichtlich. Die Einstellungen der Steuerung bleiben so,
# wie sie sind; ein Neustart des Sticks sendet keine SET-Befehle.

esphome:
  name: tor
  friendly_name: Tor
  # Repo liegt in iCloud Drive: Build ausserhalb halten, sonst synct iCloud GBs
  build_path: /Users/tr/.cache/esphome-build/tor

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

logger:
  baud_rate: 0  # UART0 frei lassen; Bus-T4 laeuft auf GPIO18/21

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Tor Fallback"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80
  auth:
    type: digest
    username: admin
    password: !secret web_password

external_components:
  - source: components

uart:
  tx_pin: GPIO21
  rx_pin: GPIO18
  baud_rate: 19200

bus_t4:
  id: bus

cover:
  - platform: bus_t4
    name: "Tor"
    id: gate
    auto_learn_timing: true
    open_duration: 20s
    close_duration: 20s
    position_report_interval: 1s

button:
  - platform: template
    name: "Teil-Auf 1"
    icon: "mdi:gate-arrow-right"
    on_press:
      - lambda: id(gate).send_cmd(CMD_OPEN_PARTIAL_1);

  - platform: template
    name: "Schritt"
    icon: "mdi:gate"
    on_press:
      - lambda: id(gate).send_cmd(CMD_STEP);

sensor:
  - platform: wifi_signal
    name: "WLAN-Signal"
    update_interval: 60s

text_sensor:
  - platform: version
    name: "ESPHome-Version"
